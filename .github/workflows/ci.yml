name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Keep the runner compatible with the locked Playwright browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pocket-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set reproducible packaging date
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify the tested artifact and source binding
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          npm run verify
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const release = JSON.parse(await readFile('dist/release.json'));
          if (release.source.commit !== process.env.EXPECTED_SOURCE || release.source.dirty) {
            throw new Error('The tested artifact must match the clean workflow commit.');
          }
          JS
      - name: Preserve the exact tested production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://mediport-pocket.abuzz-moth-0863.chatgpt.site
    # Never cancel an activation halfway through. The client and host both
    # reject a source SHA superseded by a newer main commit.
    concurrency:
      group: mediport-pocket-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: pocket-${{ github.sha }}
          path: dist/
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Deploy the tested artifact and verify live offline installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy.mjs dist --smoke
